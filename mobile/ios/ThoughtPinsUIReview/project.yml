name: DesignReview
options:
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "17.0"
packages:
  ThoughtPinsApp:
    path: ../ThoughtPinsApp
settings:
  base:
    SWIFT_VERSION: 5.9
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  DesignReview:
    type: application
    platform: iOS
    sources: [App.swift]
    dependencies:
      - package: ThoughtPinsApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thoughtpins.designreview
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  DesignReviewTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: DesignReview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thoughtpins.designreview.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DesignReview:
    build:
      targets:
        DesignReview: all
    test:
      targets: [DesignReviewTests]
