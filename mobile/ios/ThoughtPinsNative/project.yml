name: ThoughtPins

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  ThoughtPinsApp:
    path: ../ThoughtPinsApp
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.1.0

settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 5.9
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ThoughtPins:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources
    dependencies:
      - package: ThoughtPinsApp
        product: ThoughtPinsApp
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thoughtpins.app
        PRODUCT_NAME: Thought Pins
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/ThoughtPins.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_STRICT_CONCURRENCY: complete
        THOUGHTPINS_API_BASE_URL: https://api.thoughtpins.com
        GENERATE_INFOPLIST_FILE: NO

schemes:
  ThoughtPins:
    build:
      targets:
        ThoughtPins: all
    run:
      config: Debug
    archive:
      config: Release
