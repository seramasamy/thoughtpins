name: ThoughtPins

options:
  # Pinned, for the same reason swift-tools-version is pinned to 5.9: the only
  # Mac this project is developed and signed on runs Xcode 15.2.
  #
  # XcodeGen defaults projectFormat to xcode16_0, which writes
  # `objectVersion = 77`. Xcode 15.2 refuses to open that at all -- "the project
  # is in a future Xcode project file format" -- which blocks the two things
  # that can only be done in the GUI: Xcode Cloud onboarding, and selecting the
  # signing team. It never surfaced because CI runs macos-latest with a modern
  # Xcode and nothing local ever opened the project; xcodebuild reads the newer
  # format happily.
  #
  # xcode15_0 rather than xcode15_3, because 15.2 is older than 15.3. Newer
  # Xcodes open older project formats without complaint, so this costs the
  # cloud nothing.
  projectFormat: xcode15_0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

# GoogleSignIn was removed for v1. The app never offered a Google button --
# it refuses a third-party login without Sign in with Apple alongside it
# (Guideline 4.8), and Apple sign-in is not configured -- so the SDK was linked
# into the archive for a feature no code path could reach. Removing it also
# lets a Swift 5.9 toolchain build the app target at all: the SDK's manifest is
# swift-tools-version:6.0 and would not resolve. Re-adding it in 1.1 is proven:
# CI archived with it on macos-latest.
packages:
  ThoughtPinsApp:
    path: ../ThoughtPinsApp

settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 5.9
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ThoughtPins:
    type: application
    platform: iOS
    # `resources:` is not an XcodeGen target key. It was silently ignored, so
    # the asset catalog and the privacy manifest were never added to the target
    # at all: the generated project had no Copy Bundle Resources phase and the
    # archive contained only Info.plist, PkgInfo and the executable. No app
    # icon, no PrivacyInfo.xcprivacy, and a launch screen referencing a colour
    # and an image that were not in the bundle.
    #
    # Resources belong under `sources:`; XcodeGen routes each file to the right
    # build phase by extension. Info.plist and the entitlements are excluded
    # because they are consumed as build settings -- copying them into the
    # bundle as resources would ship a duplicate Info.plist, which App Store
    # Connect also rejects.
    sources:
      - Sources
      - path: Resources
        excludes:
          - Info.plist
          - ThoughtPins.entitlements
    dependencies:
      - package: ThoughtPinsApp
        product: ThoughtPinsApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thoughtpins.app
        PRODUCT_NAME: Thought Pins
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/ThoughtPins.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_STRICT_CONCURRENCY: complete
        THOUGHTPINS_API_BASE_URL: https://api.thoughtpins.com
        GENERATE_INFOPLIST_FILE: NO

schemes:
  ThoughtPins:
    build:
      targets:
        ThoughtPins: all
    run:
      config: Debug
    archive:
      config: Release
