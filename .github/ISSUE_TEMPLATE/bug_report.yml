name: Bug report
description: Report a reproducible Thought Pins defect without private user data.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities or include journal content, credentials, or signing material here. Use the private route in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide deterministic steps using fictional or redacted data.
      placeholder: |
        1. Start ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Backend/API
        - Web/PWA
        - iOS
        - Android
        - Obsidian import/export
        - Self-hosting/operations
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime versions, database, browser/device, and deployment mode. Do not include secrets.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Privacy-safe evidence
      description: Relevant request IDs, sanitized logs, or screenshots with personal data removed.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal data, journal text, private URLs, and signing material.
          required: true
        - label: This is not a vulnerability report.
          required: true
