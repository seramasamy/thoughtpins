name: ci

on:
  push:
  pull_request:
  # Native verification is opt-in; see the ios job below for why.
  workflow_dispatch:
    inputs:
      run_native:
        description: "Run the macOS iOS build"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONPATH: src

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            uv.lock
            requirements-prod.lock

      - name: Install locked development dependencies
        run: |
          python -m pip install uv==0.11.28
          python -m uv export --frozen --extra dev --extra workers --no-emit-project --format requirements-txt --output-file /tmp/requirements-dev.txt
          python -m pip install --require-hashes -r /tmp/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Several store and contract checks read the shipped web bundle rather than
      # the source, so they need a real build to inspect. Without one they were
      # reporting a missing frontend/dist as a failure.
      - name: Build the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Compile
        run: python -m compileall src tests scripts alembic

      - name: Architecture and dependency fitness
        run: |
          python scripts/check_architecture_budget.py
          python scripts/check_python_maintainability.py
          python scripts/check_dependency_locks.py
          python scripts/export_openapi.py --check

      - name: Lint and type check
        run: |
          ruff format --check .
          ruff check .
          mypy src/thoughtpins scripts

      - name: Security and publication hygiene
        run: |
          python -m bandit -r src/thoughtpins -ll
          python scripts/forbidden_scan.py
          python scripts/check_log_privacy.py
          python scripts/check_public_export.py
          python scripts/check_workspace_hygiene.py
          python scripts/check_rls_static.py
          python scripts/check_container_supply_chain.py
          python -m pip_audit -r requirements-prod.lock --require-hashes --disable-pip
          python scripts/generate_sbom.py

      - name: Product and store contracts
        run: |
          python scripts/check_domain_readiness.py
          python scripts/app_store_compliance_check.py
          python scripts/check_free_launch.py
          python scripts/check_app_store_approval_tilt.py
          python scripts/check_store_submission_packet.py
          python scripts/check_native_review_handoff.py

      - name: Web app contracts
        run: |
          python scripts/check_web_app_contract.py
          python scripts/check_web_accessibility_contract.py
          python scripts/check_web_responsive_layout.py
          python scripts/check_pwa_contract.py
          python scripts/check_web_review_harness.py

      - name: Release and store packets
        run: |
          python scripts/check_deployment_packet.py
          python scripts/check_launch_packet.py
          python scripts/check_mobile_core.py
          python scripts/check_ios_submission_source.py
          python scripts/check_store_readiness_matrix.py
          python scripts/check_review_account_packet.py
          python scripts/check_review_notes_packet.py

      - name: Test
        env:
          # Celery refuses to build an app without a broker address. The worker
          # recovery tests exercise scheduling logic and never connect.
          CELERY_BROKER_URL: redis://localhost:6379/1
        run: python -m pytest

      - name: Migration round trip
        run: python scripts/check_migration_roundtrip.py

      - name: Production configuration smoke
        env:
          ENVIRONMENT: production
          DATABASE_URL: postgresql+psycopg2://user:password@localhost:5432/thoughtpins
          AUTO_CREATE_TABLES: "false"
          REQUIRE_API_AUTH: "true"
          API_KEY: ci-bootstrap-key-01234567890123456789
          JWT_SECRET: ci-jwt-secret-01234567890123456789
          REDIS_URL: redis://localhost:6379/0
          RATE_LIMIT_ENABLED: "true"
          PROCESS_ENTRIES_ASYNC: "true"
          INGESTION_QUEUE_BACKEND: celery
          CELERY_BROKER_URL: redis://localhost:6379/1
          SENTRY_DSN: https://examplePublicKey@example.ingest.sentry.io/1
          LLM_API_KEY: ci-llm-key
          EMBEDDING_PROVIDER: openai
          OPENAI_API_KEY: ci-embedding-key
          DATA_ENCRYPTION_KEY: __teAEiSx6mPRbwBVXb9-SWJa7b-e0D5d1gtD89EZvI=
          # VECTOR_MODE defaults to qdrant_local, which production rejects, so the
          # smoke has to name a remote vector store the way a real deploy does.
          # These are placeholders: the step validates configuration shape and
          # never opens a connection.
          VECTOR_MODE: qdrant_remote
          QDRANT_URL: https://ci-placeholder.qdrant.example
          QDRANT_API_KEY: ci-qdrant-key
          VECTOR_HEALTHCHECK_LIVE: "true"
          # Production transcribes through a hosted provider; the default is
          # local, which needs the voice extra and the whisper model that CI
          # deliberately does not install. Mirror the real deployment.
          TRANSCRIPTION_PROVIDER: hosted
          TRANSCRIPTION_API_KEY: ci-transcription-key
          TRANSCRIPTION_BASE_URL: https://api.openai.com/v1
          TRANSCRIPTION_MODEL: whisper-1
          PRIVACY_POLICY_URL: https://thoughtpins.com/privacy
          TERMS_URL: https://thoughtpins.com/terms
          SUPPORT_URL: https://thoughtpins.com/support
          ACCOUNT_DELETION_URL: https://thoughtpins.com/account/delete
          AI_DISCLOSURE_URL: https://thoughtpins.com/ai-disclosure
          WEB_APP_URL: https://app.thoughtpins.com/app
          IOS_STORE_URL: https://apps.apple.com/app/thought-pins/id0000000000
          ANDROID_STORE_URL: https://play.google.com/store/apps/details?id=com.thoughtpins.app
          TELEGRAM_TEST_MODE: "false"
          ENABLE_FOUNDER_MODE: "false"
        run: python scripts/validate_production.py

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: thoughtpins_test
          POSTGRES_USER: thoughtpins
          POSTGRES_PASSWORD: thoughtpins
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thoughtpins -d thoughtpins_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install locked development dependencies
        run: |
          python -m pip install uv==0.11.28
          python -m uv export --frozen --extra dev --extra workers --no-emit-project --format requirements-txt --output-file /tmp/requirements-dev.txt
          python -m pip install --require-hashes -r /tmp/requirements-dev.txt

      - name: PostgreSQL tests
        env:
          THOUGHTPINS_TEST_DATABASE_URL: postgresql+psycopg2://thoughtpins:thoughtpins@localhost:5432/thoughtpins_test
          # Celery refuses to build an app without a broker address. The worker
          # recovery tests never connect; they exercise scheduling logic and only
          # need the app to exist.
          CELERY_BROKER_URL: redis://localhost:6379/1
        run: python -m pytest

      - name: PostgreSQL migration and RLS proof
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+psycopg2://thoughtpins:thoughtpins@localhost:5432/thoughtpins_test
          RLS_VERIFY_DATABASE_URL: postgresql+psycopg2://thoughtpins_rls_app:thoughtpins_rls_app@localhost:5432/thoughtpins_test
          AUTO_CREATE_TABLES: "false"
          REQUIRE_API_AUTH: "false"
          JWT_SECRET: ci-jwt-secret
        run: |
          python - <<'PY'
          from os import environ
          from sqlalchemy import create_engine, text

          engine = create_engine(environ["DATABASE_URL"])
          with engine.begin() as connection:
              connection.execute(text("DROP SCHEMA public CASCADE"))
              connection.execute(text("CREATE SCHEMA public"))
          PY
          alembic upgrade head
          python - <<'PY'
          from os import environ
          from sqlalchemy import create_engine, text

          engine = create_engine(environ["DATABASE_URL"])
          with engine.begin() as connection:
              connection.execute(text("DROP ROLE IF EXISTS thoughtpins_rls_app"))
              connection.execute(text("CREATE ROLE thoughtpins_rls_app LOGIN PASSWORD 'thoughtpins_rls_app'"))
              connection.execute(text("GRANT USAGE ON SCHEMA public TO thoughtpins_rls_app"))
              connection.execute(text("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO thoughtpins_rls_app"))
          PY
          python scripts/verify_postgres_rls.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit and build
        run: |
          npm audit --audit-level=high
          npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser and offline tests
        run: |
          npm run smoke:web
          npm run smoke:pwa

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/android

    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test and package
        run: ./gradlew :thoughtpins-core:test :thoughtpins-app:assembleDebug --no-daemon

  ios:
    # macOS minutes bill at 10x on a private repository, and this job cannot
    # pass without a Mac to iterate on, so running it per-push exhausted the
    # allowance and took the whole workflow down with it. Source shape is
    # still verified on every push by check_ios_submission_source.py on Linux;
    # this is the part that actually needs the platform.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test shared Swift package
        run: swift test --package-path mobile/ios/ThoughtPinsCore

      - name: Build unsigned simulator app
        env:
          THOUGHTPINS_IOS_DESTINATION: generic/platform=iOS Simulator
        run: ./scripts/prepare_ios_submission.sh

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Build production image
        run: docker build --pull --tag thoughtpins-backend:ci .
