name: ci

on:
  # Scoped to the trunk and tags. An unrestricted `push` alongside
  # `pull_request` ran the whole five-job matrix twice for every branch commit
  # that also had a PR open — 21 of 43 commits in one recent window, at roughly
  # 35-40 billable minutes each. Branch commits are covered by pull_request; the
  # trunk is covered here.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Native verification is opt-in; see the ios job below for why.
  workflow_dispatch:
    inputs:
      run_native:
        description: "Run the macOS iOS build"
        type: boolean
        default: true
      upload_testflight:
        description: "Upload the signed build to App Store Connect after validation"
        type: boolean
        default: false

permissions:
  contents: read

# Keyed by event as well as ref. With one group per ref, a push to main and a
# workflow_dispatch on main computed the same key, so an unrelated doc commit
# cancelled a hand-triggered run -- and since `ios` does not run on pushes, the
# native verification simply vanished with no failed run to notice. That
# happened on 2ed3d2d.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONPATH: src

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            uv.lock
            requirements-prod.lock

      - name: Install locked development dependencies
        run: |
          python -m pip install uv==0.12.5
          python -m uv export --frozen --extra dev --extra workers --no-emit-project --format requirements-txt --output-file /tmp/requirements-dev.txt
          python -m pip install --require-hashes -r /tmp/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Several store and contract checks read the shipped web bundle rather than
      # the source, so they need a real build to inspect. Without one they were
      # reporting a missing frontend/dist as a failure.
      - name: Build the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Compile
        run: python -m compileall src tests scripts alembic

      - name: Architecture and dependency fitness
        run: |
          python scripts/check_architecture_budget.py
          python scripts/check_python_maintainability.py
          python scripts/check_dependency_locks.py
          python scripts/export_openapi.py --check

      - name: Lint and type check
        run: |
          ruff format --check .
          ruff check .
          mypy src scripts tests

      - name: Security and publication hygiene
        run: |
          python -m bandit -r src/thoughtpins -ll
          python scripts/forbidden_scan.py
          python scripts/check_log_privacy.py
          python scripts/check_public_export.py
          python scripts/check_docs_links.py
          python scripts/check_workspace_hygiene.py
          python scripts/check_rls_static.py
          python scripts/check_container_supply_chain.py
          python -m pip_audit -r requirements-prod.lock --require-hashes --disable-pip
          # The line above audits the production export, which is 78 of 205
          # resolved packages. The optional extras that self-hosting instructions
          # tell people to install are the other 127, and a published advisory sat
          # in one of them while this step reported clean.
          python scripts/check_optional_extra_dependencies.py
          python scripts/generate_sbom.py

      - name: Product and store contracts
        run: |
          python scripts/check_domain_readiness.py
          python scripts/app_store_compliance_check.py
          python scripts/check_free_launch.py
          python scripts/check_app_store_approval_tilt.py
          python scripts/check_store_submission_packet.py
          python scripts/check_native_review_handoff.py

      - name: Web app contracts
        run: |
          python scripts/check_web_app_contract.py
          python scripts/check_web_accessibility_contract.py
          python scripts/check_web_responsive_layout.py
          python scripts/check_pwa_contract.py
          python scripts/check_site_cache_key.py
          python scripts/check_web_review_harness.py

      - name: Release and store packets
        run: |
          python scripts/check_deployment_packet.py
          python scripts/check_launch_packet.py
          python scripts/check_mobile_core.py
          python scripts/check_ios_submission_source.py
          python scripts/check_store_readiness_matrix.py
          python scripts/check_review_account_packet.py
          python scripts/check_review_notes_packet.py

      - name: Test
        env:
          # Celery refuses to build an app without a broker address. The worker
          # recovery tests exercise scheduling logic and never connect.
          CELERY_BROKER_URL: redis://localhost:6379/1
        run: python -m pytest

      - name: Migration round trip
        run: python scripts/check_migration_roundtrip.py

      - name: Production configuration smoke
        # The environment lives in scripts/production_smoke_env.py so this
        # workflow and the local release gate validate the same shape.
        run: python scripts/check_production_config_shape.py

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: thoughtpins_test
          POSTGRES_USER: thoughtpins
          POSTGRES_PASSWORD: thoughtpins
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thoughtpins -d thoughtpins_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install locked development dependencies
        run: |
          python -m pip install uv==0.12.5
          python -m uv export --frozen --extra dev --extra workers --no-emit-project --format requirements-txt --output-file /tmp/requirements-dev.txt
          python -m pip install --require-hashes -r /tmp/requirements-dev.txt

      - name: PostgreSQL tests
        env:
          THOUGHTPINS_TEST_DATABASE_URL: postgresql+psycopg2://thoughtpins:thoughtpins@localhost:5432/thoughtpins_test
          # Celery refuses to build an app without a broker address. The worker
          # recovery tests never connect; they exercise scheduling logic and only
          # need the app to exist.
          CELERY_BROKER_URL: redis://localhost:6379/1
        run: python -m pytest

      - name: PostgreSQL migration and RLS proof
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+psycopg2://thoughtpins:thoughtpins@localhost:5432/thoughtpins_test
          RLS_VERIFY_DATABASE_URL: postgresql+psycopg2://thoughtpins_rls_app:thoughtpins_rls_app@localhost:5432/thoughtpins_test
          AUTO_CREATE_TABLES: "false"
          REQUIRE_API_AUTH: "false"
          JWT_SECRET: ci-jwt-secret
        run: |
          python - <<'PY'
          from os import environ
          from sqlalchemy import create_engine, text

          engine = create_engine(environ["DATABASE_URL"])
          with engine.begin() as connection:
              connection.execute(text("DROP SCHEMA public CASCADE"))
              connection.execute(text("CREATE SCHEMA public"))
          PY
          alembic upgrade head
          python - <<'PY'
          from os import environ
          from sqlalchemy import create_engine, text

          engine = create_engine(environ["DATABASE_URL"])
          with engine.begin() as connection:
              connection.execute(text("DROP ROLE IF EXISTS thoughtpins_rls_app"))
              connection.execute(text("CREATE ROLE thoughtpins_rls_app LOGIN PASSWORD 'thoughtpins_rls_app'"))
              connection.execute(text("GRANT USAGE ON SCHEMA public TO thoughtpins_rls_app"))
              connection.execute(text("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO thoughtpins_rls_app"))
          PY
          python scripts/verify_postgres_rls.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit and build
        run: |
          npm audit --audit-level=high
          npm run test:unit
          npm run build

      # WebKit is the engine every iPhone and iPad runs, including inside every
      # third-party iOS browser. Chromium alone cannot see a WebKit layout
      # difference or an iPad Slide Over window.
      - name: Install Chromium, WebKit and Firefox
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Browser and offline tests
        run: |
          npm run smoke:web
          npm run smoke:pwa

      - name: Website product, keyboard and accessibility tests
        run: npm run smoke:site:ui

      - name: iOS device matrix
        run: npm run smoke:ios

      - name: Firefox authentication, recovery and accessibility
        run: npm run smoke:firefox

      - name: Keep browser results and review screenshots
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: browser-release-review
          path: |
            frontend/test-results/
            reports/playwright-*.json
            reports/playwright-html/
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/android

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test and package
        run: ./gradlew :thoughtpins-core:test :thoughtpins-app:assembleDebug --no-daemon

  # Does this push actually touch iOS? macOS minutes bill at 10x, and most
  # commits here are Python or documentation. Seconds on Linux to answer.
  ios-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      touched: ${{ steps.check.outputs.touched }}
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - id: check
        env:
          THOUGHTPINS_PUSH_BASE: ${{ github.event.before }}
        run: |
          # Compare the entire push. HEAD~1 misses earlier commits in a batch
          # and merge promotions whose first parent already has the new tree.
          if ! git cat-file -e "${THOUGHTPINS_PUSH_BASE}^{commit}" 2>/dev/null; then
            echo "touched=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only "$THOUGHTPINS_PUSH_BASE" HEAD > "$RUNNER_TEMP/thoughtpins-push-paths.txt"
          if grep -qE '^(mobile/ios/|frontend/(scripts/native-review-server\.mjs|e2e/mockApi\.ts)|scripts/(prepare_ios_submission\.sh|ios_release\.sh|check_ios_submission_source\.py)|\.github/workflows/(ci|ios-native-review)\.yml)' "$RUNNER_TEMP/thoughtpins-push-paths.txt"; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

  ios-native:
    # Deliberate, and narrower than "every push" on purpose.
    #
    # macOS minutes bill at 10x on a private repository, and running this per
    # push exhausted the allowance and took the whole workflow down with it.
    # But the opposite extreme was worse and was what we had: gating on tags
    # and manual dispatch only meant every green check on main excluded iOS
    # entirely, and the archive was only ever proven by someone remembering to
    # press a button.
    #
    # So: it runs on a push to main **when the push touched iOS**, on a v* tag,
    # and on demand. A Python-only or docs-only commit still costs nothing. A
    # commit that changes Swift, the project spec, or the iOS scripts cannot
    # receive a successful iOS check without tests and an archive build.
    #
    # Pull requests stay excluded: a branch is usually pushed many times before
    # it merges, and main is the boundary that matters.
    needs: [ios-changes]
    if: >-
      always()
      && (
        startsWith(github.ref, 'refs/tags/')
        || (github.event_name == 'workflow_dispatch' && inputs.run_native)
        || (github.event_name == 'push' && needs.ios-changes.outputs.touched == 'true')
      )
    strategy:
      fail-fast: false
      matrix:
        device_family: [iPhone, iPad]
    uses: ./.github/workflows/ios-native-review.yml
    with:
      device_family: ${{ matrix.device_family }}

  ios:
    # Archive and signing are allowed only after both fresh-runner device
    # reviews pass. A simulator failure must never permit distribution.
    needs: [ios-native]
    if: always() && needs.ios-native.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The build number is the commit count, so the history has to be here.
          fetch-depth: 0

      - name: Check release commands with the macOS system shell
        run: python3 -m unittest discover -s tests -p test_ios_release_script.py -v

      # ---------------------------------------------------------------
      # Everything below runs the SAME script Xcode Cloud will run.
      #
      # This job used to `brew install xcodegen` and generate the project
      # itself, which meant ci_post_clone.sh -- the thing an Xcode Cloud build
      # actually depends on -- had never executed anywhere. That made it the
      # most likely first-cloud-build failure, and Xcode Cloud bills 25 compute
      # hours a month while GitHub macOS minutes are cheap. So it is proven
      # here instead.
      #
      # Both build-number branches are exercised, because the two systems
      # disagree about which exists: Xcode Cloud sets CI_BUILD_NUMBER, a local
      # Mac has only git history.

      # Branch 1: no CI_BUILD_NUMBER, which is what a local Mac run looks like.
      # Must fall back to the commit count and must not fail.
      - name: Post-clone script without CI_BUILD_NUMBER
        run: |
          set -euo pipefail
          env -u CI_BUILD_NUMBER ./mobile/ios/ThoughtPinsNative/ci_scripts/ci_post_clone.sh \
            | tee /tmp/post-clone-local.log
          grep -q "from commit count" /tmp/post-clone-local.log \
            || { echo "did not fall back to the commit count" >&2; exit 1; }
          EXPECTED=$(git rev-list --count HEAD)
          grep -q "CURRENT_PROJECT_VERSION: $EXPECTED" mobile/ios/ThoughtPinsNative/project.yml \
            || { echo "project.yml was not stamped with $EXPECTED" >&2; exit 1; }
          test -d mobile/ios/ThoughtPinsNative/ThoughtPins.xcodeproj

      # Back to a clean checkout: the script mutates project.yml, and branch 2
      # must start from the committed floor rather than branch 1's result.
      - name: Reset to a clean checkout
        run: |
          git checkout -- mobile/ios/ThoughtPinsNative/project.yml
          rm -rf mobile/ios/ThoughtPinsNative/ThoughtPins.xcodeproj
          grep -q "CURRENT_PROJECT_VERSION: 1$" mobile/ios/ThoughtPinsNative/project.yml

      # Branch 2: CI_BUILD_NUMBER exported the way Xcode Cloud sets it. This is
      # the path a real cloud build takes, and the number must reach the binary.
      - name: Post-clone script with CI_BUILD_NUMBER
        env:
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          ./mobile/ios/ThoughtPinsNative/ci_scripts/ci_post_clone.sh | tee /tmp/post-clone-cloud.log
          grep -q "from CI_BUILD_NUMBER" /tmp/post-clone-cloud.log \
            || { echo "CI_BUILD_NUMBER was not preferred over the commit count" >&2; exit 1; }
          echo "THOUGHTPINS_BUILD_NUMBER=$CI_BUILD_NUMBER" >> "$GITHUB_ENV"
          # prepare_ios_submission.sh calls a bare `xcodegen`; the post-clone
          # script installs a pinned copy outside PATH on purpose, so hand the
          # location to the steps that follow rather than installing twice.
          dirname "$(grep '^XCODEGEN_BIN=' /tmp/post-clone-cloud.log | cut -d= -f2-)" >> "$GITHUB_PATH"

      - name: Test shared Swift package
        run: swift test --package-path mobile/ios/ThoughtPinsCore

      - name: Build unsigned simulator app
        env:
          THOUGHTPINS_IOS_DESTINATION: generic/platform=iOS Simulator
        run: ./scripts/prepare_ios_submission.sh

      # The simulator build above compiles for the simulator SDK in Debug. This
      # is the only step that compiles the app the way a submission does:
      # Release configuration, whole-module optimisation, the device arm64
      # slice, and the archive packaging itself. Unsigned, so it needs no
      # release account -- signing and upload stay release-account work -- but
      # everything up to signing is exercised.
      - name: Build unsigned archive
        run: |
          cd mobile/ios/ThoughtPinsNative
          xcodebuild \
            -project ThoughtPins.xcodeproj \
            -scheme ThoughtPins \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ThoughtPins.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Confirm the archive contains the app
        run: |
          APP="$RUNNER_TEMP/ThoughtPins.xcarchive/Products/Applications/Thought Pins.app"
          test -d "$APP" || { echo "No app in archive at $APP" >&2; exit 1; }
          echo "Archived binary architectures:"
          lipo -info "$APP/Thought Pins"

      # The source gate reasons about $(...) placeholders; this is the same
      # rules against the plist Xcode actually produced, where an unset build
      # setting has become an empty string. An empty CFBundleURLSchemes entry
      # is malformed and is what v1 was shipping.
      - name: Check the built Info.plist
        run: |
          python3 scripts/check_ios_submission_source.py --built-app \
            "$RUNNER_TEMP/ThoughtPins.xcarchive/Products/Applications/Thought Pins.app"

      # No build-setting override here on purpose: the number came from
      # ci_post_clone.sh stamping project.yml, exactly as it will on Xcode
      # Cloud. Asserting it in the binary is what proves that path works.
      - name: Confirm the build number reached the binary
        run: |
          PLIST="$RUNNER_TEMP/ThoughtPins.xcarchive/Products/Applications/Thought Pins.app/Info.plist"
          BUILT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "CFBundleVersion=$BUILT expected=$THOUGHTPINS_BUILD_NUMBER"
          test -n "$BUILT" || { echo "CFBundleVersion is empty" >&2; exit 1; }
          test "$BUILT" = "$THOUGHTPINS_BUILD_NUMBER" || {
            echo "CFBundleVersion did not take the override" >&2; exit 1; }
          test "$BUILT" != "1" || { echo "CFBundleVersion is still pinned to 1" >&2; exit 1; }

      # $RUNNER_TEMP dies with the runner. Keeping the archive means a failed
      # submission can be retried without a 30-minute rebuild at 10x billing,
      # and the dSYMs inside it are what symbolicates a crash report.
      - name: Keep the archive and its dSYMs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ThoughtPins-${{ env.THOUGHTPINS_BUILD_NUMBER }}-xcarchive
          path: ${{ runner.temp }}/ThoughtPins.xcarchive
          retention-days: 30
          if-no-files-found: error

      # ---------------------------------------------------------------
      # Signing and upload. Authored now, switched off until the account
      # exists.
      #
      # Every step below is gated on the signing secrets being present, so
      # today they all skip and the job stays exactly as green as it was.
      # The point of writing them now is that the day the developer account
      # lands, the only remaining work is pasting six secrets into the
      # repository settings -- not designing a signing pipeline under time
      # pressure with a submission waiting.
      #
      # Secrets to create, all under Settings > Secrets and variables >
      # Actions:
      #   APPLE_TEAM_ID              10-character Team ID
      #   APPLE_CERT_P12_BASE64      base64 of the Apple Distribution .p12
      #   APPLE_CERT_P12_PASSWORD    password for that .p12
      #   APPLE_API_KEY_ID           App Store Connect API key id
      #   APPLE_API_ISSUER_ID        App Store Connect API issuer id
      #   APPLE_API_PRIVATE_KEY      contents of the AuthKey_*.p8
      #
      # An API key is used rather than an Apple ID and app-specific password
      # because it is scoped, revocable, and does not carry a human account.
      - name: Import the signing certificate
        if: env.APPLE_TEAM_ID != '' && env.APPLE_CERT_P12_BASE64 != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # A dedicated keychain, with a random password, deleted at job end.
          # Never the login keychain: a runner is shared infrastructure.
          KEYCHAIN="$RUNNER_TEMP/thoughtpins-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Export a signed build
        if: env.APPLE_TEAM_ID != '' && env.APPLE_CERT_P12_BASE64 != '' && env.APPLE_API_KEY_ID != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # The reviewed options file from the repository, with only the Team
          # ID filled in. Nothing about how this is signed is invented here.
          OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          sed "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" \
            apple-submission/ExportOptions.plist > "$OPTIONS"
          # -allowProvisioningUpdates needs an App Store Connect API key to mint
          # or update a profile headlessly (there is no signed-in Xcode on a
          # runner). Without the -authenticationKey* flags the export blocks
          # trying to reach an Apple ID it cannot, so the same key the upload
          # step uses is written here too. This whole signed path is untested
          # from a Mac-less setup — see XCODE_CLOUD_RUNBOOK.md.
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ThoughtPins.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$OPTIONS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"
          rm -rf "$RUNNER_TEMP/private_keys"

      - name: Upload to App Store Connect
        if: env.APPLE_API_KEY_ID != '' && github.event_name == 'workflow_dispatch' && inputs.upload_testflight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Validation dispatches do not distribute a build. Upload requires
          # its own explicit selection as well as the signing credentials.
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_PRIVATE_KEY" \
            > "$RUNNER_TEMP/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' -maxdepth 1 | head -1)
          test -n "$IPA" || { echo "no .ipa to upload" >&2; exit 1; }
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"
          rm -rf "$RUNNER_TEMP/private_keys"

      - name: Remove the signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build production image
        run: docker build --pull --tag thoughtpins-backend:ci .
