[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thoughtpins"
version = "1.0.0rc1"
description = "Thought Pins AI journaling backend for iOS, Android, and Web."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["journal", "memory", "second-brain", "fastapi", "obsidian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.139.0",
    "starlette>=1.3.1",
    "uvicorn>=0.20",
    "openai>=1.30.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "jinja2>=3.1",
    "networkx>=3.2",
    "rich>=13.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    # Imported directly by thoughtpins.utils. It used to arrive only as a
    # transitive of celery and matplotlib, which live in optional extras, so any
    # install without those extras could not import the app at all.
    "python-dateutil>=2.9",
    "PyYAML>=6.0.3",
    "qdrant-client>=1.9",
    "cryptography>=50.0.0",
    "loguru>=0.7",
    "sentry-sdk>=2.0",
    "pytz>=2024.1",
    "PyJWT[crypto]>=2.13.0",
    "argon2-cffi>=25.1.0",
    "httpx>=0.27",
    "redis>=5.0",
    "defusedxml>=0.7.1",
    "json-repair>=0.61,<1",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0",
]
reports = [
    "matplotlib>=3.8",
    "pyvis>=0.3",
    "reportlab>=4.0",
]
voice = [
    "openai-whisper>=20240930",
]
telegram = [
    "python-telegram-bot>=21.0",
    "easyocr>=1.7",
    "openai-whisper>=20240930",
    "pypdf>=4.0",
]
workers = [
    "celery>=5.3",
]
graph = [
    "graphiti-core[kuzu]>=0.28.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "httpx>=0.27",
    "httpx2>=2.5.0",
    "ruff>=0.8",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "bandit==1.9.4",
    "radon==6.0.1",
    "vulture==2.16",
    "uv==0.11.28",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    ".deps",
    ".tmp",
    "backups",
    "data",
    "frontend/node_modules",
    "logs",
    "mobile/android/**/build",
    "reports",
    "vault",
]

[tool.ruff.lint]
select = ["E9", "F", "I", "B"]

[tool.mypy]
# Match the interpreter CI and production actually run. Pinned at 3.11 this
# parsed modern third-party stubs under 3.11 rules and died on numpy's use of
# `type` statements, which are 3.12+. requires-python stays at 3.11 because
# nothing here needs newer syntax; this setting is about the analysis runtime.
python_version = "3.13"
mypy_path = "src"
ignore_missing_imports = true
follow_imports = "skip"
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
